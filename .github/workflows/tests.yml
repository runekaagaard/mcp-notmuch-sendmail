name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        mcp-version: ["2.1.1"]
        include:
          # the mcp>=1.2.0 compatibility claim, oldest and newest 1.x
          - python-version: "3.10"
            mcp-version: "1.2.0"
          - python-version: "3.12"
            mcp-version: "1.28.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libnotmuch headers (the notmuch2 python bindings compile against them)
        run: sudo apt-get update && sudo apt-get install -y libnotmuch-dev
      - name: Install package and test dependencies
        run: |
          pip install . pytest
          pip install "mcp[cli]==${{ matrix.mcp-version }}"
      - name: Run tests
        run: pytest tests/ -q
